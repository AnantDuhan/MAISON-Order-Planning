version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # The 9.x client only talks to Elasticsearch 9 servers (an 8.x server
      # answers 400). Remove this once the cluster is upgraded to 9.
      - dependency-name: "@elastic/elasticsearch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Packages that only work at matching versions arrive in ONE pull request.
    # Merged one by one they broke main: react-dom 19 next to react 18, and
    # @mui/material 9 next to @mui/icons-material 7.
    groups:
      react:
        patterns: ["react", "react-dom"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      redux:
        patterns: ["redux", "react-redux", "redux-thunk", "@redux-devtools/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
