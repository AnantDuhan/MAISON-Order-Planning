$kind: 'http-request'
name: Update Profile
order: 2000
method: PUT
url: '{{baseUrl}}/me/update'
body:
  type: formdata
  content:
    - key: name
      type: text
      value: 'John Doe'
    - key: email
      type: text
      value: 'john@example.com'
    - key: image
      type: file
      src: ''
