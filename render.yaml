version: "1"
projects:
- name: Order Planning
  environments:
  - name: Production
    services:
    - type: web
      name: Order Planning
      runtime: docker
      dockerfilePath: ./Dockerfile
      repo: https://github.com/AnantDuhan/MERN-Ecommerce
      plan: free
      region: oregon
      autoDeployTrigger: commit
      healthCheckPath: /api/v1/health
      # NOTE: with runtime: docker, the Dockerfile performs the build (installs
      # backend deps, builds the frontend). No buildCommand is used.
      # Render assigns PORT automatically; do NOT declare it — the app binds
      # process.env.PORT.
      envVars:
      # --- Runtime ---
      - key: NODE_ENV
        value: production            # serves the built frontend (same-origin)
      # ENABLE_IN_PROCESS_CRON stays unset/false; jobs run via the /jobs
      # endpoints driven by .github/workflows/cron.yml.

      # --- Database ---
      - key: DB_URI
        sync: false
      - key: DB_HOSTED_URI
        sync: false

      # --- Auth / sessions ---
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: COOKIE_EXPIRES
        sync: false
      - key: GOOGLE_CLIENT_ID        # backend reads GOOGLE_CLIENT_ID (not *_OAUTH_*)
        sync: false

      # --- App config ---
      - key: FRONTEND_URL            # same-origin: set to the deployed app URL
        sync: false
      - key: RESULT_PER_PAGE
        sync: false

      # --- Scheduled jobs ---
      - key: CRON_SECRET             # required by POST /api/v1/jobs/*
        sync: false

      # --- Email (pooled SMTP) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_MAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NEWSLETTER_UNSUBSCRIBE_URL
        sync: false

      # --- Payments / membership (Cashfree) ---
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENVIRONMENT
        sync: false
      - key: CASHFREE_RETURN_URL
        sync: false
      - key: CASHFREE_WEBHOOK_URL
        sync: false
      - key: CASHFREE_MONTHLY_AMOUNT
        sync: false
      - key: CASHFREE_YEARLY_AMOUNT
        sync: false

      # --- AI (review summaries) ---
      - key: GEMINI_API_KEY
        sync: false

      # --- Cache (Upstash REST + optional node redis client) ---
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOSTED_URL
        sync: false

      # --- Storage (AWS S3) ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_BUCKET_REGION
        sync: false