name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Use npm 11 (the lockfiles are written with it)
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run linter
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./backend
        run: npm test --if-present

      - name: Build backend
        working-directory: ./backend
        run: npm run build --if-present

      # There are no tests yet; at minimum make sure every module parses and
      # the app wiring loads (catches broken requires / syntax errors).
      - name: Syntax check
        working-directory: ./backend
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  backend-db:
    name: Backend database tests
    runs-on: ubuntu-latest

    # A real MongoDB for tests-db/ (indexes, atomic updates, queries).
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Use npm 11 (the lockfiles are written with it)
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run database tests
        working-directory: ./backend
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
        run: npm run test:db

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11 (the lockfiles are written with it)
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
