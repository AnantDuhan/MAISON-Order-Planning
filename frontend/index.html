<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0E0D" media="(prefers-color-scheme: dark)" />

    <!-- Defaults; each page overrides these through <MetaData /> -->
    <title>Maison · Curated Furniture & Home Objects</title>
    <meta name="description" content="Maison is a curated store for furniture and home objects — chosen with intention, made to be kept. Free returns, secure checkout." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maison" />
    <meta property="og:title" content="Maison · Curated Furniture & Home Objects" />
    <meta property="og:description" content="Furniture and home objects chosen with intention, made to be kept." />
    <meta property="og:image" content="https://orderplanning.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://orderplanning.netlify.app/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: preconnect + stylesheet link is faster than a CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" />

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js" defer></script>

    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
